<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guest Check-in | Osaka Stay</title>
<style>
  :root { --gold:#c9a86a; --ink:#1c1a17; --cream:#faf7f0; }
  * { box-sizing: border-box; }
  body { margin:0; background:#171512; color:var(--cream);
         font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  h1 { text-align:center; font-size:26px; letter-spacing:.12em; margin:8px 0 4px; }
  .sub { text-align:center; color:#cfc7b8; font-size:13px; margin-bottom:18px; }
  .langs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px; }
  .langs button { border:1px solid #6b6254; background:transparent; color:var(--cream);
         border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .langs button.on { background:var(--gold); border-color:var(--gold); color:#171512; font-weight:600; }
  .card { background:var(--cream); color:var(--ink); border-radius:16px; padding:24px 20px 28px; }
  .note { color:#6f675a; font-size:12.5px; margin:0 0 18px; line-height:1.7; }
  label { display:block; font-weight:600; font-size:14px; margin:18px 0 6px; }
  label .req { color:#c0392b; }
  label small { font-weight:normal; color:#8a8172; display:block; font-size:12px; margin-top:2px; }
  input, textarea { width:100%; padding:12px; font-size:16px; border:1px solid #d5ccb8;
         border-radius:10px; background:#fff; }
  textarea { min-height:74px; resize:vertical; }
  button.submit { width:100%; margin-top:26px; padding:15px; font-size:16px; font-weight:700;
         color:#171512; background:var(--gold); border:none; border-radius:10px; cursor:pointer; }
  button.submit:disabled { opacity:.5; }
  .done { text-align:center; padding:44px 10px; display:none; }
  .done .big { font-size:44px; }
  .privacy { color:#8a8172; font-size:11.5px; margin-top:16px; line-height:1.7; }
  .codebox { background:#f0e9da; border:1px dashed #c9a86a; border-radius:10px;
         padding:10px 12px; font-size:15px; letter-spacing:.06em; }
  ::placeholder { color:#bcb2a0; }
  /* 「全員同じ住所です」のチェック（押しやすいよう帯ごとタップできる） */
  .chk { display:flex; align-items:center; gap:10px; margin:8px 0 10px; padding:11px 13px;
         background:#f0e9da; border:1px solid #e0d6c0; border-radius:10px;
         font-weight:600; font-size:14px; cursor:pointer; }
  .kz { margin:22px 0 4px; padding:14px 14px 6px; border:2px solid var(--gold); border-radius:14px; background:#fffdf7; }
  .kz .kzh { font-weight:700; font-size:15px; }
  .kz .kzh small { display:block; font-weight:400; color:#6f675a; font-size:12.5px; margin-top:3px; }
  .opts { display:flex; flex-direction:column; gap:7px; margin:6px 0 12px; }
  .opts label.chk { margin:0; font-weight:500; }
  .opts label.chk.off { opacity:.4; }
  .kznote { margin:-4px 0 10px; font-size:13px; color:#9a5b2e; font-weight:600; }
  .chk input { width:20px; height:20px; flex:0 0 auto; margin:0; accent-color:var(--gold); cursor:pointer; }
  .hint { color:#8a8172; font-size:12.5px; margin:6px 0 0; line-height:1.7; }
  /* 人数ボタン（押した数だけカードが出る） */
  .counts { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
  .counts button { flex:1 1 44px; min-width:44px; padding:13px 0; font-size:17px; font-weight:600;
         border:1px solid #d5ccb8; background:#fff; color:var(--ink); border-radius:10px; cursor:pointer; }
  .counts button.on { background:var(--gold); border-color:var(--gold); color:#171512; }
  /* ゲスト1人ぶんのカード */
  .guest { border:1px solid #e4dac4; border-radius:12px; padding:2px 14px 16px;
         margin:14px 0; background:#fffdf7; }
  .guest .gtitle { font-size:13px; font-weight:700; letter-spacing:.06em; color:#a08a56;
         margin:14px 0 2px; }
  .guest label { margin:12px 0 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OSAKA STAY</h1>
  <div class="sub" data-i18n="sub"></div>

  <div class="langs" id="langs"></div>

  <div class="card" id="formCard">
    <p class="note" data-i18n="note"></p>
    <form id="ci">
      <label><span data-i18n="q_code"></span>
        <small data-i18n="q_code_s"></small></label>
      <div class="codebox" id="codeShow">-</div>

      <label><span data-i18n="q_count"></span> <span class="req">*</span>
        <small data-i18n="q_count_s"></small></label>
      <div class="counts" id="counts"></div>

      <div id="guests"></div>

      <label><span data-i18n="q_period"></span> <span class="req">*</span></label>
      <input id="f_period" required data-i18n-ph="ph_period">

      <div class="kz">
        <div class="kzh"><span data-i18n="kz_head"></span><small data-i18n="kz_head_s"></small></div>
        <label><span data-i18n="q_futon"></span></label>
        <div class="opts">
          <label class="chk"><input type="radio" name="futon" value="1"><span data-i18n="futon1"></span></label>
          <label class="chk"><input type="radio" name="futon" value="2"><span data-i18n="futon2"></span></label>
          <label class="chk"><input type="radio" name="futon" value="3"><span data-i18n="futon3"></span></label>
        </div>
        <p class="kznote" id="kzNote" data-i18n="futon_max2" hidden></p>
        <label><span data-i18n="q_baby"></span></label>
        <div class="opts">
          <label class="chk"><input type="radio" name="baby" value="yes"><span data-i18n="yes"></span></label>
          <label class="chk"><input type="radio" name="baby" value="no"><span data-i18n="no"></span></label>
        </div>
      </div>

      <button class="submit" type="submit" data-i18n="send"></button>
      <p class="privacy" data-i18n="privacy"></p>
    </form>
  </div>

  <div class="card done" id="doneCard">
    <div class="big">✅</div>
    <h2 data-i18n="thanks"></h2>
    <p data-i18n="thanks_s" style="color:#6f675a"></p>
  </div>
</div>

const order = ["en","zh","zhTW","ja","ko","fr","de","es"];
const langsDiv = document.getElementById("langs");
order.forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = I18N[k].name; b.dataset.lang = k;
  b.onclick = () => setLang(k);
  langsDiv.appendChild(b);
});
function setLang(k) {
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === k));
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const t = I18N[k][el.dataset.i18n]; if (t) el.textContent = t;
  });
  // 入力欄の中の薄いお手本
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const t = I18N[k][el.dataset.i18nPh]; if (t) el.placeholder = t;
  });
  if (typeof renderGuests === "function") renderGuests();
  document.documentElement.lang = I18N[k].htmlLang || k;
  saveLang(k);
}
// プライベートモード等でlocalStorageが使えないと例外で止まり、ページが真っ白になるため必ず包む
function savedLang() { try { return localStorage.getItem("ci_lang"); } catch(_) { return null; } }
function saveLang(k) { try { localStorage.setItem("ci_lang", k); } catch(_) {} }
// ブラウザ言語で初期表示
// 中国語だけは字体で分ける：zh-TW / zh-HK / zh-MO / zh-Hant → 繁體中文、それ以外の zh → 简体中文
function detectLang() {
  const list = (navigator.languages && navigator.languages.length)
             ? navigator.languages : [navigator.language || "en"];
  for (const raw of list) {
    const tag = String(raw).toLowerCase();
    if (tag.startsWith("zh")) return /hant|-tw|-hk|-mo/.test(tag) ? "zhTW" : "zh";
    const two = tag.slice(0,2);
    if (I18N[two]) return two;
  }
  return "en";
}
// ====== 人数ボタン → その人数ぶんのカードを出す ======
const MAX_GUESTS = 8;   // 神崎川が最大7名。乳幼児が加わる場合があるので1つ余裕をみている
const countsDiv = document.getElementById("counts");
const guestsDiv = document.getElementById("guests");

// 入力内容はここに持つ（カードを作り直しても消えないように）
let guests = [{ name:"", nat:"", passport:"", sameNat:false, addr:"", contact:"", job:"", sameAsRep:false, sameContact:false }];

function curLang() {
  const b = document.querySelector(".langs button.on");
  return (b && I18N[b.dataset.lang]) ? b.dataset.lang : "en";
}
function blankGuest() { return { name:"", nat:"", passport:"", sameNat:true, addr:"", contact:"", job:"", sameAsRep:true, sameContact:true }; }

function setCount(n) {
  n = Math.max(1, Math.min(MAX_GUESTS, n));
  while (guests.length < n) guests.push(blankGuest());
  guests.length = n;                       // 減らすときは後ろから外す（前の入力は残る）
  guests[0].sameAsRep = false;             // 代表者さまは必ずご自身の住所・国籍
  guests[0].sameNat = false;
  guests[0].sameContact = false;
  renderCounts(); renderGuests();
}
function renderCounts() {
  countsDiv.innerHTML = "";
  for (let i = 1; i <= MAX_GUESTS; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = i;
    if (i === guests.length) b.className = "on";
    b.onclick = () => setCount(i);
    countsDiv.appendChild(b);
  }
}

// 1人ぶんの入力欄を作る小道具
function field(labelText, hintText, value, onInput, opts) {
  opts = opts || {};
  const lab = document.createElement("label");
  lab.textContent = labelText;
  if (opts.required) { const r = document.createElement("span"); r.className = "req"; r.textContent = " *"; lab.appendChild(r); }
  if (hintText) { const sm = document.createElement("small"); sm.textContent = hintText; lab.appendChild(sm); }
  const inp = document.createElement("input");
  inp.value = value || "";
  inp.placeholder = opts.ph || "";
  if (opts.required) inp.required = true;
  if (opts.autocomplete) inp.autocomplete = opts.autocomplete;
  inp.addEventListener("input", () => onInput(inp.value));
  const wrap = document.createDocumentFragment();
  wrap.appendChild(lab); wrap.appendChild(inp);
  return wrap;
}

function renderGuests() {
  const T = I18N[curLang()];
  guestsDiv.innerHTML = "";
  guests.forEach((g, i) => {
    const card = document.createElement("div"); card.className = "guest";
    const ttl = document.createElement("div"); ttl.className = "gtitle";
    ttl.textContent = T.guest_label + " " + (i + 1) + (i === 0 ? T.rep_mark : "");
    card.appendChild(ttl);

    // 「代表者さまと同じ」チェックを作る小道具
    const sameBox = (labelText, on, onChange) => {
      const chk = document.createElement("label"); chk.className = "chk";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = on;
      const sp = document.createElement("span"); sp.textContent = labelText;
      cb.addEventListener("change", () => { onChange(cb.checked); renderGuests(); });
      chk.appendChild(cb); chk.appendChild(sp); return chk;
    };

    card.appendChild(field(T.g_name, null, g.name, v => g.name = v,
      { required:true, ph:T.ph_name1 }));

    // 国籍：2人目以降は代表者から引き継げる（ご家族はたいてい同じ）
    if (i > 0) card.appendChild(sameBox(T.nat_same_rep, g.sameNat, v => g.sameNat = v));
    if (i === 0 || !g.sameNat) {
      card.appendChild(field(T.g_nat, null, g.nat, v => g.nat = v,
        { required:true, ph:T.ph_nat }));
    }
    // 旅券番号は「日本国内に住所のない外国籍の方」だけ必要なので任意にしている
    card.appendChild(field(T.g_passport, T.g_passport_s, g.passport, v => g.passport = v,
      { ph:T.ph_passport }));

    if (i > 0) card.appendChild(sameBox(T.addr_same_rep, g.sameAsRep, v => g.sameAsRep = v));
    if (i === 0 || !g.sameAsRep) {
      card.appendChild(field(T.g_addr, null, g.addr, v => g.addr = v,
        { required:true, ph:T.ph_addr, autocomplete:"street-address" }));
    }
    // 連絡先も法令上ぜんいん必須（旅館業法施行規則4条の2第3項／特区民泊 規則10条の2第3項）
    if (i > 0) card.appendChild(sameBox(T.contact_same_rep, g.sameContact, v => g.sameContact = v));
    if (i === 0 || !g.sameContact) {
      card.appendChild(field(T.q_contact, null, g.contact, v => g.contact = v,
        { required:true, ph:T.ph_contact, autocomplete:"email" }));
    }
    card.appendChild(field(T.g_job, null, g.job, v => g.job = v, { ph:T.ph_job }));
    guestsDiv.appendChild(card);
  });
}

// ====== 名簿へ送る文字列を組み立てる（これまでの書き方をそのまま守る）======
function namesValue()   { return guests.map(g => g.name.trim()).join("\n"); }
function natpassValue() {
  return guests.map(g => {
    const nat = (g.sameNat ? guests[0].nat : g.nat).trim();
    const pp  = g.passport.trim();
    return pp ? (nat + " / " + pp) : nat;
  }).join("\n");
}
function jobValue()     { return guests.map(g => g.job.trim()).filter(Boolean).join("\n"); }
function contactValue() {
  if (guests.length === 1) return guests[0].contact.trim();
  const allSame = guests.slice(1).every(g => g.sameContact);
  if (allSame) return guests[0].contact.trim() + "\nsame for all";
  return guests.map(g =>
    g.name.trim() + " / " + (g.sameContact ? guests[0].contact.trim() : g.contact.trim())
  ).join("\n");
}
function addressValue() {
  if (guests.length === 1) return guests[0].addr.trim();
  const allSame = guests.slice(1).every(g => g.sameAsRep);
  if (allSame) return guests[0].addr.trim() + "\nsame for all";
  return guests.map(g =>
    g.name.trim() + " / " + (g.sameAsRep ? guests[0].addr.trim() : g.addr.trim())
  ).join("\n");
}

  three.closest("label").classList.toggle("off", limit);
  if (limit && three.checked) { three.checked = false; document.querySelector('input[name="futon"][value="2"]').checked = true; }
  document.getElementById("kzNote").hidden = !limit;
}
document.querySelectorAll('input[name="baby"]').forEach(r => r.addEventListener("change", syncFutonLimit));
const saved = savedLang();
setCount(1);
setLang(I18N[saved] ? saved : detectLang());

// ====== 予約コード（URLの ?code= から）======
const code = new URLSearchParams(location.search).get("code") || "";
document.getElementById("codeShow").textContent = code || "—";

// ====== 送信（Googleフォームへ）======
document.getElementById("ci").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.querySelector("button.submit");
  btn.disabled = true;
  const fd = new FormData();
  fd.append(ENTRY.code, code || "(no code)");
  fd.append(ENTRY.names, namesValue());
  fd.append(ENTRY.natpass, natpassValue());
  fd.append(ENTRY.address, addressValue());
  fd.append(ENTRY.job, jobValue());
  fd.append(ENTRY.contact, contactValue());
  fd.append(ENTRY.period, document.getElementById("f_period").value);
  const fu = document.querySelector('input[name="futon"]:checked');
  if (fu) fd.append(ENTRY.futon, FUTON_OPT[fu.value]);
  const bb = document.querySelector('input[name="baby"]:checked');
  if (bb) fd.append(ENTRY.baby, BABY_OPT[bb.value]);
  try { await fetch(FORM_URL, { method:"POST", mode:"no-cors", body:fd }); } catch(_) {}
  document.getElementById("formCard").style.display = "none";
  document.getElementById("doneCard").style.display = "block";
  window.scrollTo(0,0);
});
</script>
</body>
</html>
